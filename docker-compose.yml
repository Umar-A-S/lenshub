services:
  app:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    container_name: lenshub-app
    volumes:
      - .:/var/www/html
    networks:
      - lenshub-network

  nginx:
    image: nginx:alpine
    container_name: lenshub-nginx
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - lenshub-network

  db:
    image: mariadb:10.6
    container_name: lenshub-db
    restart: always
    environment:
      MYSQL_DATABASE: lenshub
      MYSQL_ROOT_PASSWORD: password
    ports:
      - "3307:3306"
    networks:
      - lenshub-network

networks:
  lenshub-network:
    driver: bridge
